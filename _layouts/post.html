---
layout: default
---

<div class="post-header">
  <div class="category">{{ page.categories }}</div>
  <h1>{{ page.title }}</h1>
  <p>{{ page.excerpt }}</p>
  <div>
    <span class="author">{{ page.author }}</span>
    <time class="date">{{ page.date | date: '%d %B %Y'}}</time>
  </div>
</div>

{{ content }}
