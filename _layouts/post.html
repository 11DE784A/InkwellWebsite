---
layout: default
---

<div class="post-header">
  <div>
    {% for tag in page.tags %} <span class="tag">{{ tag }}</span> {% endfor %}
    {% if page.category %} <span class="tag">Issue {{ page.category }}</span> {% endif %}
  </div>
  <h1>{{ page.title }}</h1>
  <p>{{ page.excerpt }}</p>
  <div>
    <span class="author">{{ page.author }}</span>
    <time class="date">{{ page.date | date: '%d %B %Y'}}</time>
  </div>
</div>

{{ content }}
